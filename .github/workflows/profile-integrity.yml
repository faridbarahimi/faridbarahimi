name: Profile Integrity
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify profile assets
        run: |
          set -e
          test -s README.md
          test -s assets/aicp-hero.svg
          test -s assets/aicp-architecture.svg
          test -s assets/aicp-routing.svg
          test -s assets/aicp-worker-continuity.svg
          test -s .aicp/profile-status.json
          grep -q 'faridbarahimi/AICP-Core-Platform' README.md
