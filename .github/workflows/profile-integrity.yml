name: Profile Integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify profile assets
        run: |
          set -e
          test -s README.md
          for f in             assets/aicp-hero.svg             assets/aicp-architecture.svg             assets/aicp-routing.svg             assets/aicp-worker-continuity.svg             assets/aicp-evidence.svg; do
            test -s "$f"
          done
          grep -q "AICP-Core-Platform" README.md
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          for p in Path("assets").glob("*.svg"):
              ET.parse(p)
          print("All SVG assets are well-formed.")
          PY
