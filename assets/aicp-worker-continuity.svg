<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430"><rect width="1200" height="430" rx="24" fill="#020617"/><text x="55" y="55" fill="#67e8f9" font-family="Arial" font-size="18" font-weight="700" letter-spacing="4">WORKER CONTINUITY</text><g font-family="Arial" text-anchor="middle"><rect x="70" y="130" width="260" height="100" rx="18" fill="#0f172a" stroke="#334155"/><text x="200" y="170" fill="white" font-size="23" font-weight="700">TASK</text><text x="200" y="198" fill="#94a3b8" font-size="13">durable state - checkpoints</text><path d="M330 180H455" stroke="#22d3ee" stroke-width="3"/><rect x="455" y="105" width="290" height="150" rx="20" fill="#0b1220" stroke="#22d3ee" stroke-width="2"/><text x="600" y="145" fill="#67e8f9" font-size="18" font-weight="700">TASK TRANSACTION</text><text x="600" y="177" fill="#e2e8f0" font-size="14">isolated workspace</text><text x="600" y="202" fill="#e2e8f0" font-size="14">resumable checkpoint</text><text x="600" y="227" fill="#e2e8f0" font-size="14">no partial publication</text><path d="M745 180H850" stroke="#818cf8" stroke-width="3"/><rect x="850" y="70" width="270" height="82" rx="16" fill="#0f172a" stroke="#334155"/><rect x="850" y="205" width="270" height="82" rx="16" fill="#0f172a" stroke="#334155"/><text x="985" y="104" fill="white" font-size="17" font-weight="700">WORKER A</text><text x="985" y="130" fill="#94a3b8" font-size="12">running - stopped - failed</text><text x="985" y="239" fill="white" font-size="17" font-weight="700">WORKER B</text><text x="985" y="265" fill="#94a3b8" font-size="12">replacement - continuation</text><text x="600" y="340" fill="white" font-size="25" font-weight="800">WORKER STOPPED != TASK STOPPED</text><text x="600" y="368" fill="#94a3b8" font-size="13">execution resources are replaceable; task continuity is durable</text></g></svg>
