<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390"><defs><linearGradient id="g"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#818cf8"/></linearGradient></defs><rect width="1200" height="390" rx="24" fill="#020617"/><text x="55" y="55" fill="#67e8f9" font-family="Arial" font-size="18" font-weight="700" letter-spacing="4">EVIDENCE -&gt; VERIFICATION</text><g font-family="Arial" text-anchor="middle"><g fill="#0f172a" stroke="#334155"><rect x="45" y="120" width="190" height="90" rx="15"/><rect x="255" y="120" width="190" height="90" rx="15"/><rect x="465" y="120" width="190" height="90" rx="15"/><rect x="675" y="120" width="190" height="90" rx="15"/><rect x="885" y="120" width="250" height="90" rx="15"/></g><g fill="white" font-size="17" font-weight="700"><text x="140" y="157">OBSERVED</text><text x="350" y="157">EVIDENCE</text><text x="560" y="157">VERIFIED</text><text x="770" y="157">AUTHORIZED</text><text x="1010" y="157">IMPLEMENTED</text></g><g fill="#94a3b8" font-size="11"><text x="140" y="182">what happened</text><text x="350" y="182">inspectable proof</text><text x="560" y="182">independent check</text><text x="770" y="182">human / policy gate</text><text x="1010" y="182">actual state change</text></g><path d="M235 165H255M445 165H465M655 165H675M865 165H885" stroke="url(#g)" stroke-width="3"/></g><text x="600" y="292" text-anchor="middle" fill="#e2e8f0" font-family="Arial" font-size="24" font-weight="700">ACCEPTED != AUTHORIZED != IMPLEMENTED</text><text x="600" y="322" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="13">Claims are not outcomes. Outcomes are not trusted without verification.</text></svg>
